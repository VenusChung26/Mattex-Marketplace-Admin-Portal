<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ask for Price · WhatsApp · Subbie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: "#F1F7F3", 600: "#245A41", 700: "#1B4633", 800: "#143528" },
            ink: "#1C1C1C",
            mute: "#5C5C5C",
            line: "#D8D8D8",
            paper: "#F3F4F2",
            wa: "#25D366",
          },
          fontFamily: { sans: ['"IBM Plex Sans"', "Helvetica", "Arial", "sans-serif"] },
        },
      },
    };
  </script>
</head>
<body class="bg-paper text-ink font-sans antialiased min-h-screen">
  <header class="bg-white border-b border-line">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5">
        <span class="inline-flex h-9 w-9 items-center justify-center rounded-sm bg-brand-600 text-white font-bold text-sm">SB</span>
        <div class="leading-tight">
          <span class="block text-lg font-bold">Subbie</span>
          <span class="block text-[11px] text-mute">Storefront</span>
        </div>
      </a>
      <a href="index.html#products" class="text-sm text-mute hover:text-brand-600">Back to products</a>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 py-12">
    <div class="bg-white border border-line p-6 sm:p-8">
      <div class="mx-auto mb-4 inline-flex h-14 w-14 items-center justify-center rounded-sm bg-[#25D366] text-white">
        <svg class="w-8 h-8" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M20.52 3.48A11.8 11.8 0 0012.05 0C5.5 0 .2 5.3.2 11.84c0 2.09.55 4.12 1.6 5.92L0 24l6.4-1.68a11.86 11.86 0 005.65 1.44h.01c6.54 0 11.84-5.3 11.84-11.84 0-3.16-1.23-6.13-3.48-8.44zM12.06 21.5h-.01a9.65 9.65 0 01-4.92-1.35l-.35-.21-3.8 1 1.01-3.7-.23-.38a9.63 9.63 0 01-1.48-5.13c0-5.33 4.34-9.67 9.68-9.67 2.59 0 5.02 1.01 6.85 2.84a9.6 9.6 0 012.83 6.84c0 5.33-4.35 9.66-9.68 9.66zm5.3-7.24c-.29-.15-1.72-.85-1.98-.94-.27-.1-.46-.15-.66.14-.19.29-.76.94-.93 1.13-.17.2-.34.22-.63.07-.29-.15-1.22-.45-2.33-1.43-.86-.77-1.44-1.72-1.61-2.01-.17-.29-.02-.45.13-.6.13-.13.29-.34.43-.51.15-.17.19-.29.29-.49.1-.19.05-.37-.02-.52-.07-.15-.66-1.59-.9-2.18-.24-.57-.48-.49-.66-.5h-.56c-.19 0-.5.07-.76.37-.26.29-1 1-1 2.43s1.02 2.82 1.17 3.01c.14.19 2 3.05 4.85 4.28.68.29 1.21.47 1.62.6.68.21 1.3.18 1.79.11.55-.08 1.72-.7 1.96-1.38.24-.68.24-1.26.17-1.38-.07-.12-.26-.19-.55-.34z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-brand-800 text-center">Ask for Price on WhatsApp</h1>
      <p id="productLine" class="mt-3 text-sm text-mute text-center"></p>
      <p class="mt-4 text-sm text-mute leading-relaxed text-center">
        WhatsApp opens with a pre-filled inquiry. RFQ draft is optional and separate unless you check below.
      </p>

      <label class="mt-6 flex items-start gap-3 border border-line p-3 text-sm cursor-pointer hover:border-brand-600">
        <input id="addToRfq" type="checkbox" class="mt-1 accent-[#245A41]" />
        <span>
          <span class="font-semibold text-ink">Also add to my RFQ draft</span>
          <span class="block text-mute mt-0.5">Requires login. Pure WhatsApp still works without an account.</span>
        </span>
      </label>

      <button id="continueBtn" type="button"
        class="mt-6 inline-flex w-full justify-center rounded-sm bg-[#25D366] px-4 py-2.5 text-sm font-semibold text-white hover:bg-[#1ebe57]">
        Continue to WhatsApp
      </button>
      <a href="index.html" class="mt-3 inline-flex w-full justify-center rounded-sm border border-line px-4 py-2.5 text-sm font-semibold text-ink hover:border-brand-600 hover:text-brand-600">
        Stay on storefront
      </a>
    </div>
  </main>

  <script src="js/store.js"></script>
  <script>
    const product = getProduct(getQueryParam("id"));
    const productLine = document.getElementById("productLine");
    const addToRfq = document.getElementById("addToRfq");
    const continueBtn = document.getElementById("continueBtn");
    const waHref = whatsappUrl(product || null);

    productLine.textContent = product
      ? `Product: ${product.name} · ${formatPrice(product.price)}`
      : "General pricing inquiry";

    function goWhatsApp() {
      window.location.href = waHref;
    }

    continueBtn.addEventListener("click", () => {
      if (!addToRfq.checked) {
        goWhatsApp();
        return;
      }
      if (!product) {
        goWhatsApp();
        return;
      }
      if (!isLoggedIn()) {
        setPendingWhatsappRfq(product.id);
        window.location.href = "login.html";
        return;
      }
      addToCart(product.id);
      window.open(waHref, "_blank", "noopener,noreferrer");
      window.location.href = "rfq.html";
    });
  </script>
</body>
</html>
