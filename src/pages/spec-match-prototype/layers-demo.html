<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>示範 · 三層分開 | 未改市集</title>
<!-- One demo of Q1 option 1. Collapsed and expanded both separate 檔案抽出, 市集建議, and 其他建議. Not wired into the marketplace. -->
<style>
  :root {
    --brand-50: #F1F7F3;
    --brand-100: #DCECE2;
    --brand-600: #245A41;
    --brand-700: #1B4633;
    --brand-800: #143528;
    --paper: #F6F7F5;
    --line: #D6DDD8;
    --ink: #121816;
    --mute: #5A665F;
    --red-bg: #F8E8E8;
    --red-line: #E7C1C1;
    --red-ink: #8a2b2b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.45 ui-sans-serif, system-ui, sans-serif; }
  header { background: #1a1f1c; color: white; padding: 14px 20px; display: flex; align-items: center; gap: 16px; }
  header strong { font-size: 15px; letter-spacing: 0.02em; }
  header span { color: #c5cdc8; font-size: 13px; }
  main { max-width: 1080px; margin: 0 auto; padding: 28px 16px 120px; }
  h1 { margin: 0; color: var(--brand-800); font-size: 28px; font-weight: 650; }
  .note { margin: 8px 0 0; color: var(--mute); }
  .tools { display: flex; justify-content: flex-end; gap: 8px; margin: 22px 0 10px; }
  button { font: inherit; cursor: pointer; }
  .ghost { border: 1px solid var(--line); background: white; padding: 6px 12px; }
  .ghost.on { border-color: var(--brand-600); color: var(--brand-800); }
  table { width: 100%; border-collapse: separate; border-spacing: 0; background: white; border: 1px solid var(--line); }
  th { text-align: left; font-size: 12px; color: var(--mute); font-weight: 650; padding: 8px 12px; border-bottom: 1px solid var(--line); background: white; position: sticky; top: 0; }
  td { padding: 12px; vertical-align: top; }
  tr.summary { cursor: pointer; }
  tr.summary td { border-bottom: 1px solid var(--line); }
  tr.summary.open td { border-bottom: 0; }
  tr.detail td { padding: 0 12px 12px; background: white; border-bottom: 1px solid var(--line); }
  .name { display: block; font-weight: 650; }
  .spec, .source { display: block; margin-top: 2px; color: var(--mute); font-size: 12px; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 4px; }
  .pill { display: inline-block; padding: 1px 8px; font-size: 12px; font-weight: 650; }
  .pill.none { color: var(--mute); background: var(--paper); border: 1px solid var(--line); }
  .pill.used { color: var(--brand-800); background: var(--brand-100); }
  .clear, .hint { border: 0; background: transparent; padding: 0; color: var(--brand-700); font-weight: 650; }
  .price { font-variant-numeric: tabular-nums; }
  .del { border: 1px solid var(--red-line); background: var(--red-bg); color: var(--red-ink); padding: 4px 8px; font-size: 12px; font-weight: 650; }
  .price-cell { display: flex; justify-content: space-between; gap: 8px; }
  tr.detail td { padding-top: 0; }
  .pick-line { padding-bottom: 8px; }
  .moq { display: block; margin-top: 4px; color: var(--mute); font-size: 12px; }
  .file-instead { display: inline-block; margin-top: 8px; border: 0; background: transparent; padding: 0; font-weight: 650; color: var(--ink); }
  .other-title { display: block; margin-top: 12px; color: var(--mute); font-size: 12px; font-weight: 650; }
  .line { display: block; width: 100%; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; padding: 8px 0; }
  .line .spec { display: inline; margin-left: 8px; }
  .state { margin: 14px 0 0; color: var(--mute); font-size: 12px; }
  .mask { position: fixed; inset: 0; background: rgba(18, 24, 22, 0.5); display: flex; align-items: center; justify-content: center; }
  .dialog { background: white; padding: 20px; width: min(420px, calc(100% - 32px)); }
  .dialog p { margin: 0; font-weight: 650; }
  .dialog .who { margin-top: 4px; color: var(--mute); font-weight: 400; }
  .dialog .row { display: flex; gap: 8px; margin-top: 16px; }
  .empty { padding: 28px 12px; color: var(--mute); }
</style>
</head>
<body>
<header>
  <strong>Mattex Marketplace</strong>
  <span>示範頁 · 市集規格配對沒有改</span>
</header>
<main>
  <h1>三層分開</h1>
  <p class="note">「檔案抽出」和「市集建議」只在欄名。已用這件可以取消選擇，列和建議貨品會留下。</p>
  <div class="tools">
    <button type="button" class="ghost" id="collapse">全部收起</button>
    <button type="button" class="ghost on" id="expand">全部展開</button>
  </div>
  <div id="table"></div>
  <p class="state" id="state"></p>
</main>
<div id="dialog"></div>
<script>
const seed = [
  {
    key: "pdf-medium",
    buyerName: "Concrete Paving Block Medium Grey",
    buyerSpec: "200x100 THK",
    source: "Footbridge-261012.pdf · PDF",
    qty: "17",
    open: true,
    choice: "",
    shown: 0,
    matches: [
      { name: "Precast Concrete Paving — Grey", spec: "Grey · HyD H 5101A & H 5102A", price: "價格待定", moq: "最低訂購量 1 lot", tone: "#8d928c" },
      { name: "Precast Concrete Paving — Dark Grey", spec: "Dark Grey · HyD H 5101A & H 5102A", price: "價格待定", moq: "最低訂購量 1 lot", tone: "#3e4240" },
      { name: "Precast Concrete Block", spec: "300x300x200", price: "價格待定", moq: "最低訂購量 1 lot", tone: "#c4b8a5" },
      { name: "Precast Concrete Block", spec: "1000x1000x1000", price: "價格待定", moq: "最低訂購量 1 lot", tone: "#a89880" }
    ]
  },
  {
    key: "png-dark",
    buyerName: "Concrete Paving Block Dark Grey",
    buyerSpec: "200x100x60mm THK",
    source: "RFQ 18.png · 圖片",
    qty: "12",
    open: true,
    choice: "",
    shown: 0,
    matches: [
      { name: "Precast Concrete Paving — Dark Grey", spec: "Dark Grey · HyD H 5101A & H 5102A", price: "價格待定", moq: "最低訂購量 1 lot", tone: "#3e4240" },
      { name: "Precast Concrete Paving — Grey", spec: "Grey · HyD H 5101A & H 5102A", price: "價格待定", moq: "最低訂購量 1 lot", tone: "#8d928c" },
      { name: "UPVC Pipe & Fittings — Grey", spec: "Color: Grey", price: "價格待定", moq: "最低訂購量 1 lot", tone: "#9aa3a0" }
    ]
  },
  {
    key: "png-light",
    buyerName: "Concrete Paving Block Light Grey",
    buyerSpec: "200x100x60mm THK",
    source: "RFQ 18.png · 圖片",
    qty: "46",
    open: true,
    choice: "catalog",
    shown: 0,
    matches: [
      { name: "Precast Concrete Paving — Grey", spec: "Grey · HyD H 5101A & H 5102A", price: "價格待定", moq: "最低訂購量 1 lot", tone: "#b7b7b2" },
      { name: "Precast Concrete Paving — Dark Grey", spec: "Dark Grey · HyD H 5101A & H 5102A", price: "價格待定", moq: "最低訂購量 1 lot", tone: "#3e4240" },
      { name: "Interior Wall Paint Granite Stone Coating-A", spec: "Granite texture", price: "價格待定", moq: "最低訂購量 1 lot", tone: "#d7cfc2" }
    ]
  }
];

let rows = seed.map((row) => ({ ...row, matches: row.matches.map((item) => ({ ...item })) }));
let pendingKey = "";

function esc(value) {
  return String(value).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
}

function render() {
  const allOpen = rows.length > 0 && rows.every((row) => row.open);
  const allShut = rows.every((row) => !row.open);
  document.getElementById("expand").classList.toggle("on", allOpen);
  document.getElementById("collapse").classList.toggle("on", allShut);

  const body = rows.map((row, index) => {
    const match = row.matches[row.shown];
    const used = row.choice === "catalog";
    const choice = used
      ? `<span class="pill used">已用這件</span><button type="button" class="clear" data-clear="${row.key}">取消選擇</button>`
      : `<span class="pill none">未選</span>`;
    const summary = `
      <tr class="summary${row.open ? " open" : ""}" data-key="${row.key}">
        <td>#${index + 1}</td>
        <td>
          <span class="name">${esc(row.buyerName)}</span>
          <span class="spec">${esc(row.buyerSpec)}</span>
          <span class="source">${esc(row.source)}</span>
        </td>
        <td>
          <span class="name">${esc(match.name)}</span>
          <span class="meta">${choice}</span>
        </td>
        <td>${esc(row.qty)}</td>
        <td>
          <div class="price-cell">
            <span class="price">${esc(match.price)}</span>
            <button type="button" class="del" data-del="${row.key}">刪除</button>
          </div>
        </td>
      </tr>`;
    if (!row.open) return summary;
    const otherHtml = row.matches.map((item, itemIndex) => itemIndex === row.shown ? "" : `
      <button type="button" class="line" data-use="${row.key}" data-index="${itemIndex}">
        <span class="name">${esc(item.name)}</span>
        <span class="spec">${esc(item.spec)}</span>
      </button>`).join("");
    const detail = `
      <tr class="detail">
        <td></td>
        <td></td>
        <td colspan="3">
          <div class="pick-line">
            <span class="spec">${esc(match.spec)}</span>
            ${used ? "" : `<span class="meta"><button type="button" class="hint" data-pick="${row.key}">點一下就用這件</button></span>`}
            <span class="moq">${esc(match.moq)} · ${esc(match.price)}</span>
          </div>
          <button type="button" class="file-instead">目錄不是這件？按檔案自己填</button>
          <span class="other-title">其他建議</span>
          ${otherHtml}
        </td>
      </tr>`;
    return summary + detail;
  }).join("");

  document.getElementById("table").innerHTML = rows.length
    ? `<table><thead><tr><th>#</th><th>檔案抽出</th><th>市集建議</th><th>數量</th><th>價錢</th></tr></thead><tbody>${body}</tbody></table>`
    : `<p class="empty">這頁的列已刪完。重新整理會回到三列示範。</p>`;

  document.getElementById("state").textContent = rows.map((row) => {
    const match = row.matches[row.shown];
    return `${row.buyerName}：${match.name}（${row.choice === "catalog" ? "已用這件" : "未選"}）`;
  }).join("　");

  document.getElementById("dialog").innerHTML = pendingKey ? (() => {
    const row = rows.find((item) => item.key === pendingKey);
    return `<div class="mask"><div class="dialog" role="dialog"><p>刪除這一行？</p><p class="who">${esc(row.buyerName)}</p><div class="row"><button type="button" class="del" id="yes">刪除</button><button type="button" class="ghost" id="no">取消</button></div></div></div>`;
  })() : "";
}

document.getElementById("table").addEventListener("click", (event) => {
  const del = event.target.closest("[data-del]");
  if (del) {
    event.stopPropagation();
    pendingKey = del.dataset.del;
    render();
    return;
  }
  const clear = event.target.closest("[data-clear]");
  if (clear) {
    const row = rows.find((item) => item.key === clear.dataset.clear);
    row.choice = "";
    render();
    return;
  }
  const pick = event.target.closest("[data-pick]");
  if (pick) {
    const row = rows.find((item) => item.key === pick.dataset.pick);
    row.choice = "catalog";
    render();
    return;
  }
  const use = event.target.closest("[data-use]");
  if (use) {
    const row = rows.find((item) => item.key === use.dataset.use);
    const index = Number(use.dataset.index);
    if (row.matches[index]) {
      row.shown = index;
      row.choice = "catalog";
    }
    render();
    return;
  }
  if (event.target.closest("button")) return;
  const summary = event.target.closest("tr.summary");
  if (!summary) return;
  const row = rows.find((item) => item.key === summary.dataset.key);
  row.open = !row.open;
  render();
});

document.getElementById("dialog").addEventListener("click", (event) => {
  if (event.target.id === "yes") rows = rows.filter((row) => row.key !== pendingKey);
  if (event.target.id === "yes" || event.target.id === "no" || event.target.classList.contains("mask")) pendingKey = "";
  if (event.target.id === "yes" || event.target.id === "no" || event.target.classList.contains("mask")) render();
});

document.getElementById("collapse").addEventListener("click", () => {
  rows.forEach((row) => { row.open = false; });
  render();
});
document.getElementById("expand").addEventListener("click", () => {
  rows.forEach((row) => { row.open = true; });
  render();
});

render();
</script>
</body>
</html>
